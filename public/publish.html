<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Publish | Banana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-box">
        <h1 style="color:var(--p); text-align:center;">🚀 PUBLISH ASSET</h1>
        <form id="uploadForm">
            <input type="text" id="name" placeholder="Asset Name" required>
            <textarea id="description" placeholder="Description..." rows="4" required></textarea>
            <select id="category">
                <option>Characters</option><option>Vehicles</option><option>Architecture</option><option>Props</option>
            </select>
            <label style="display:block; margin:10px 0 5px; font-size:12px; color:#777;">GLB Model File:</label>
            <input type="file" id="glbFile" accept=".glb" required>
            <label style="display:block; margin:10px 0 5px; font-size:12px; color:#777;">Source File (Zip/Source):</label>
            <input type="file" id="mainFile" required>
            <button type="submit" class="glow-btn" style="margin-top:20px">LIST ASSET NOW</button>
            <button type="button" onclick="location.href='/'" style="background:none; border:none; color:#777; width:100%; margin-top:10px; cursor:pointer;">Cancel</button>
        </form>
    </div>
    <script>
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData();
            fd.append('name', document.getElementById('name').value);
            fd.append('description', document.getElementById('description').value);
            fd.append('category', document.getElementById('category').value);
            fd.append('owner', localStorage.getItem('bananaUser'));
            fd.append('glb', document.getElementById('glbFile').files[0]);
            fd.append('main', document.getElementById('mainFile').files[0]);

            const res = await fetch('/api/upload', { method: 'POST', body: fd });
            if(res.ok) location.href = '/'; else alert("Error!");
        };
    </script>
</body>
</html>
