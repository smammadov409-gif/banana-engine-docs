<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Yayınla | Banana Corp</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <div class="logo" onclick="location.href='index.html'" style="cursor:pointer">🍌 BANANA</div>
        <div class="nav-right">
            <button onclick="location.href='index.html'" class="icon-btn"><i class="fas fa-home"></i></button>
        </div>
    </nav>

    <div class="container-box">
        <h2>🚀 Yeni Model Yayınla</h2>
        <form id="uploadForm">
            <div class="input-group">
                <label>Model Adı</label>
                <input type="text" id="modelName" placeholder="Örn: Altın Muz" required>
            </div>

            <div class="input-group">
                <label>Açıklama</label>
                <textarea id="modelDesc" placeholder="Modelin hikayesi nedir?" required></textarea>
            </div>

            <div class="input-group">
                <label>Model Dosyası (.glb / .gltf)</label>
                <input type="file" id="modelFile" accept=".glb,.gltf" required>
            </div>

            <div class="input-group">
                <label>Kategori</label>
                <select id="modelCat">
                    <option value="banana">Muzlar</option>
                    <option value="tech">Teknoloji</option>
                    <option value="art">Sanat</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="glow-btn">Yayınla 🍌</button>
        </form>
    </div>

    <script>
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Yükleniyor...";

            const name = document.getElementById('modelName').value;
            const desc = document.getElementById('modelDesc').value;
            const cat = document.getElementById('modelCat').value;
            const file = document.getElementById('modelFile').files[0];

            // 1. Dosyayı base64'e çevir (Netlify'a göndermek için)
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const modelData = {
                    name: name,
                    description: desc,
                    category: cat,
                    fileData: reader.result // Base64 formatı
                };

                try {
                    // 2. NETLİFY FONKSİYONUNA GÖNDER
                    const res = await fetch("/.netlify/functions/upload", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(modelData)
                    });

                    const data = await res.json();

                    if (res.ok && data.success) {
                        // 3. YERELDE DE SAKLA (LocalStorage - Geçici Çözüm)
                        let models = JSON.parse(localStorage.getItem('my_models') || '[]');
                        models.push(modelData);
                        localStorage.setItem('my_models', JSON.stringify(models));

                        alert("🚀 Model başarıyla fırlatıldı!");
                        window.location.href = 'index.html';
                    } else {
                        alert("Hata: " + data.error);
                    }
                } catch (err) {
                    console.error("Yükleme Hatası:", err);
                    alert("Sunucuya bağlanılamadı!");
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Yayınla 🍌";
                }
            };
        };
    </script>

</body>
</html>
