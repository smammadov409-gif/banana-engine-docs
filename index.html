<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Banana Corp | 3D Market</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="auth-screen" class="full-modal">
        <div class="container-box auth-card" style="text-align:center;">
            <h1 class="logo">🍌 BANANA</h1>
            <div id="step-1">
                <input type="email" id="loginEmail" placeholder="Gmail Address">
                <button onclick="sendOtp()" class="glow-btn" id="btn-otp">Get Access Key</button>
            </div>
            <div id="step-2" style="display:none">
                <input type="text" id="otpCode" placeholder="Enter Code">
                <button onclick="verifyOtp()" class="glow-btn" id="btn-verify">Verify</button>
            </div>
        </div>
    </div>

    <div id="main-content" style="display:none">
        <nav>
            <div class="logo">🍌 BANANA</div>
            <div class="search-bar">
                <input type="text" id="searchInput" onkeyup="searchModels()" placeholder="Search...">
            </div>
            <div class="nav-right">
                <select onchange="setLang(this.value)" class="lang-select" id="langSelector">
                    <option value="tr">TR 🇹🇷</option>
                    <option value="en">EN 🇺🇸</option>
                    <option value="fr">FR 🇫🇷</option>
                    <option value="es">ES 🇪🇸</option>
                    <option value="ru">RU 🇷🇺</option>
                </select>
                <button onclick="location.href='publish.html'" class="icon-btn"><i class="fas fa-plus-circle"></i></button>
                <button onclick="location.href='profile.html'" class="icon-btn"><i class="fas fa-user-circle"></i></button>
            </div>
        </nav>
        <div id="catalog"></div>
    </div>

    <div id="detail-modal" class="modal-overlay">
        <div class="modal-window">
            <span class="close-btn" onclick="closeDetail()">&times;</span>
            <div id="viewer-area"></div>
            <div class="info-side">
                <h1 id="det-name"></h1>
                <p id="det-desc"></p>
                <div id="det-cat" class="cat-tag"></div>
                <button id="likeBtn" class="glow-btn" style="background:#222; color:white;"></button>
                <button id="downBtn" class="glow-btn"></button>
                <button id="deleteBtn" class="glow-btn" style="background:#ff4757; display:none;"></button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
